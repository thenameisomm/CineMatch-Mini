services:
  mongodb:
    image: mongo:7
    container_name: cinematch-mini-mongo
    ports:
      - "27017:27017"
    volumes:
      - cinematch-mini-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cinematch-mini-data:
