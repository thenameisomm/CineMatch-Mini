      <rect x="780" y="182" width="70" height="28" rx="14" fill="#1A2238" stroke="#2A3450"/>
      <text x="815" y="201" text-anchor="middle" fill="#AEB7CE">drama</text>
      <rect x="860" y="182" width="196" height="28" rx="14" fill="#1A2238" stroke="#2A3450"/>
      <text x="878" y="201" fill="#AEB7CE">like: Breaking Bad</text>
    </g>

    <g>
      <text x="704" y="242" font-size="15" fill="#4E5874" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">01</text>
      <text x="736" y="243" font-size="19" fill="#E9ECF5">The Dark Knight <tspan font-size="16" fill="#727C96">2008 · movie</tspan></text>
      <text x="1094" y="243" font-size="18" text-anchor="end" fill="#FBBF24">★ 9.0</text>
      <line x1="704" y1="260" x2="1112" y2="260" stroke="#1D253A"/>

