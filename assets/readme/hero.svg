  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="64" y="76" font-size="16" letter-spacing="2.4" fill="#7C849C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ADVANCED DATABASE LAB · VIVA PROJECT</text>

    <text x="64" y="152" font-size="78" font-weight="800" fill="#F5F6FA">CineMatch</text>
    <rect x="474" y="108" width="94" height="34" rx="17" fill="#1B1530" stroke="#6743C8"/>
    <text x="521" y="131" font-size="16" font-weight="600" letter-spacing="1.6" text-anchor="middle" fill="#C4B5FD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">MINI</text>

    <text x="64" y="196" font-size="25" fill="#D8DCE9">Movie discovery, running entirely on your machine.</text>
    <text x="64" y="230" font-size="18" fill="#8D95AB">A full-stack viva project on React, Express, and local MongoDB.</text>

    <g font-size="18">
      <rect x="64" y="256" width="100" height="34" rx="10" fill="#111529" stroke="#242B41"/>
      <text x="84" y="279" fill="#B7BED1">24 titles</text>
