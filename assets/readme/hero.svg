    <text x="64" y="336" font-size="16" fill="#606A84" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">$ npm run db:seed --workspace=backend</text>
    <rect x="64" y="354" width="440" height="1" fill="url(#rule)"/>
    <text x="64" y="382" font-size="16" fill="#5F6880" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">React 19 · Express 5 · MongoDB 7 · Vitest</text>
  </g>

  <!-- Proof panel: a real natural-language search response. -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <rect x="680" y="62" width="456" height="332" rx="18" fill="#0E1322" stroke="#242B41"/>
    <rect x="680" y="62" width="456" height="46" rx="18" fill="#131A2C"/>
    <rect x="680" y="90" width="456" height="18" fill="#131A2C"/>
    <text x="704" y="91" font-size="16" letter-spacing="1.4" fill="#7C849C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">SEARCH · NATURAL</text>
    <text x="1112" y="91" font-size="16" text-anchor="end" fill="#FBBF24">16 results</text>

    <rect x="704" y="122" width="408" height="46" rx="10" fill="#161D30" stroke="#28324C"/>
    <text x="720" y="151" font-size="18" fill="#E6E9F4">dark crime dramas like Breaking Bad</text>

    <g font-size="16">
