<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">CineMatch Mini — local-first movie discovery</title>
  <desc id="heroDesc">CineMatch Mini, a full-stack viva project built on React, Express, and local MongoDB. A natural-language search for dark crime dramas like Breaking Bad returns The Dark Knight, Breaking Bad, and Dark, with the honest search path label text_fallback.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090B12"/>
      <stop offset="1" stop-color="#0C1020"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="430" rx="26" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="429" rx="25.5" fill="none" stroke="#242B41"/>
  <circle cx="1020" cy="120" r="260" fill="url(#glow)"/>

