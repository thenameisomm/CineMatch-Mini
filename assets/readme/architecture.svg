<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">CineMatch Mini architecture</title>
  <desc id="archDesc">Three local layers: a React 19 and Vite client, an Express 5 REST API with JWT cookies and Zod validation, and a local MongoDB database with four collections and live aggregation pipelines.</desc>

  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090B12"/>
      <stop offset="1" stop-color="#0C1020"/>
    </linearGradient>
    <linearGradient id="archRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5C4A93"/>
    </marker>
  </defs>

  <rect width="1200" height="330" rx="26" fill="url(#archBg)"/>
  <rect x="0.5" y="0.5" width="1199" height="329" rx="25.5" fill="none" stroke="#242B41"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="64" y="58" font-size="16" letter-spacing="2.4" fill="#7C849C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">THREE LAYERS · ONE LOCAL STACK</text>
    <text x="64" y="100" font-size="38" font-weight="700" fill="#F3F4F9">How a request becomes a recommendation</text>

    <g>
      <rect x="64" y="124" width="336" height="142" rx="14" fill="#0E1322" stroke="#242B41"/>
      <text x="88" y="152" font-size="16" letter-spacing="1.4" fill="#9A7BFA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">01 · CLIENT</text>
      <text x="88" y="184" font-size="24" font-weight="600" fill="#F0F2F8">React 19 + Vite</text>
      <text x="88" y="214" font-size="18" fill="#A9B1C7">Browse · Search · Watchlist</text>
      <text x="88" y="240" font-size="18" fill="#727C96">TanStack Query + Axios</text>
    </g>

    <line x1="412" y1="195" x2="428" y2="195" stroke="#5C4A93" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="780" y1="195" x2="796" y2="195" stroke="#5C4A93" stroke-width="1.5" marker-end="url(#arrow)"/>

    <g>
      <rect x="432" y="124" width="336" height="142" rx="14" fill="#0E1322" stroke="#242B41"/>
      <text x="456" y="152" font-size="16" letter-spacing="1.4" fill="#9A7BFA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">02 · API</text>
      <text x="456" y="184" font-size="24" font-weight="600" fill="#F0F2F8">Express 5</text>
      <text x="456" y="214" font-size="18" fill="#A9B1C7">REST /api/v1 · Zod validation</text>
      <text x="456" y="240" font-size="18" fill="#727C96">JWT HttpOnly cookies + rate limit</text>
    </g>

    <g>
      <rect x="800" y="124" width="336" height="142" rx="14" fill="#0E1322" stroke="#242B41"/>
      <text x="824" y="152" font-size="16" letter-spacing="1.4" fill="#9A7BFA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">03 · DATABASE</text>
      <text x="824" y="184" font-size="24" font-weight="600" fill="#F0F2F8">MongoDB (local)</text>
      <text x="824" y="214" font-size="18" fill="#A9B1C7">movies · users · watchlist · ratings</text>
      <text x="824" y="240" font-size="18" fill="#727C96">text + compound indexes</text>
    </g>

    <rect x="64" y="292" width="1072" height="1" fill="url(#archRule)"/>
    <text x="64" y="316" font-size="18" fill="#7B849C">One <tspan fill="#B8BED0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">movies</tspan> collection with <tspan fill="#B8BED0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">type: movie | tv</tspan> · analytics and recommendations are live aggregation pipelines.</text>
  </g>
</svg>
